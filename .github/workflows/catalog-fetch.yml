# 候補リストの本を国立国会図書館サーチで探す（1時間ごとに自動で実行。手動でも実行できる）
#
# 手動で実行：GitHub のリポジトリ画面 →「Actions」→「候補リストの本を国立国会図書館で探す」→「Run workflow」
# 自動の実行を止めたいとき：同じ画面の右上「…」→「Disable workflow」
# 検索結果は「catalog-data」ブランチに保存されます。
# 続けて、検索結果からアプリ用の本のデータ（src/data/books.auto.json）を作り、
# テストと型チェックに通ったときだけ main ブランチに保存します（報告は data/catalog/report.md）。
# 前回までに取れた本は取り直さないので、全部そろうまで何回でも実行できます。

name: 候補リストの本を国立国会図書館で探す

on:
  workflow_dispatch:
  # 1時間ごと（毎時17分）。探す本が残っていなければ、すぐに終わって何も保存しない
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: catalog-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: 前回までの結果を読み込む
        run: |
          mkdir -p catalog-output
          if git fetch --depth 1 origin catalog-data; then
            git archive FETCH_HEAD catalog | tar -x -C /tmp
            cp -r /tmp/catalog/. catalog-output/
            echo "前回の結果を読み込みました"
          else
            echo "前回の結果はありません"
          fi

      - name: 本を探す
        # 40分を過ぎたら区切りのよいところで終わり、取れた分を保存する
        env:
          MAX_RUN_MINUTES: '40'
        run: node scripts/catalog/fetch.mjs catalog-output

      - name: 本のデータを作って main に保存
        # 検索結果が変わったときだけ。テストか型チェックに失敗したら保存しない
        run: |
          if [ -f /tmp/catalog/records.json ] && cmp -s /tmp/catalog/records.json catalog-output/records.json; then
            echo "検索結果に変化がないので、本のデータは作り直しません"
            exit 0
          fi
          npm ci
          node scripts/catalog/build.mjs catalog-output/records.json data/catalog
          npx tsc -b
          npx vitest run
          if git diff --quiet -- src/data/books.auto.json data/catalog/report.md; then
            echo "本のデータに変化はありません"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/books.auto.json data/catalog/report.md
          COUNT=$(node -e 'console.log(require("./src/data/books.auto.json").length)')
          git commit --quiet -m "自動で集めた本のデータを更新（${COUNT}冊）"
          # 途中で main が更新されていたら、その上に載せ直してから保存する
          git fetch --quiet origin main
          git rebase --quiet origin/main
          git push origin HEAD:main

      - name: 結果を catalog-data ブランチに保存
        # 途中で止まっても、取れた分は保存する
        if: always()
        run: |
          if [ ! -f catalog-output/records.json ]; then
            echo "保存する結果がありません"
            exit 0
          fi
          if [ -f /tmp/catalog/records.json ] && cmp -s /tmp/catalog/records.json catalog-output/records.json; then
            echo "新しく見つかった本はありません（保存しません）"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mv catalog-output /tmp/catalog-output
          git checkout --orphan catalog-data-new
          git rm -rf --quiet .
          mkdir -p catalog
          cp -r /tmp/catalog-output/. catalog/
          git add catalog
          git commit --quiet -m "候補リストの検索結果（${GITHUB_SHA::7} 時点の候補リスト）"
          git push --force origin catalog-data-new:catalog-data
